# Laboratório (branch separada): testes que precisam de internet.
# Não gera APK. Os resultados voltam para esta branch em lab/saida/.
name: Laboratorio
on:
  push:
    branches: [laboratorio]
    paths-ignore: ['lab/saida/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rodar
        working-directory: lab
        run: |
          mkdir -p saida
          for s in $(cat tarefas.txt); do node "$s" 2>&1 | tee "saida/$(basename $s .mjs).log"; done
      - name: Devolver resultados para a branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/saida
          git commit -m "Resultados do laboratório" || echo "nada novo"
          git push
