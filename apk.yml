# =========================================================
# Gera o app Android (.apk) automaticamente.
# Roda sozinho toda vez que você envia arquivos para a branch "main"
# (ou manualmente: aba Actions > "Gerar APK Android" > Run workflow).
# No fim, o .apk aparece na página "Releases" do repositório.
# =========================================================
name: Gerar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # necessário para publicar o .apk em "Releases"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar o Capacitor
        run: npm install --no-audit --no-fund

      - name: Copiar o app para a pasta www
        run: node android-build/copiar-web.mjs

      - name: Criar o projeto Android
        run: npx cap add android

      - name: Ícones e tela de abertura
        continue-on-error: true   # se falhar, o app sai com o ícone padrão, mas sai
        run: >
          npx --yes @capacitor/assets@3.0.5 generate --android
          --iconBackgroundColor "#1E6A48" --iconBackgroundColorDark "#1E6A48"
          --splashBackgroundColor "#EEF1E8" --splashBackgroundColorDark "#15100C"

      - name: Permissão de microfone e número da versão
        run: node android-build/configurar-android.mjs

      - name: Juntar o app web com o projeto Android
        run: npx cap sync android

      - name: Usar sempre a mesma assinatura (para atualizar sem perder o progresso)
        run: |
          mkdir -p ~/.android
          cp android-build/debug.keystore ~/.android/debug.keystore

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Dar nome ao arquivo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TocaAi.apk

      - name: Guardar o APK nesta execução
        uses: actions/upload-artifact@v4
        with:
          name: TocaAi-apk
          path: TocaAi.apk

      - name: Publicar em Releases (link fixo para baixar no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Toca Aí 1.0.${{ github.run_number }}
          make_latest: true
          files: TocaAi.apk
          body: |
            **Para instalar no Android:** abra esta página no celular, toque em **TocaAi.apk**,
            e depois em **Abrir**. Se o Android pedir, permita "instalar apps desconhecidos" para o navegador.

            Para atualizar, baixe o APK mais novo e instale por cima: o seu progresso continua.
